<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Live Order Tracking - Watch your order being prepared in real time." />
  <meta name="theme-color" content="#FF7A00" />
  <title>Live Order Status - Aroma Artisan Cafe</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Supabase Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Header / Top Bar -->
  <header class="topbar">
    <div class="container topbar-content">
      <div class="brand-wrapper">
        <a id="backToMenuLink" href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 8px; color: inherit;">
          <div class="brand-icon">←</div>
          <div>
            <div class="brand-name">Aroma Artisan Cafe</div>
            <div class="table-badge" id="orderTableBadge">Table #...</div>
          </div>
        </a>
      </div>
      <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Dark/Light Mode">🌙</button>
    </div>
  </header>

  <!-- Status Content -->
  <main class="container">
    <div class="status-card">
      <div class="status-animation-icon" id="statusEmoji">👨‍🍳</div>
      <h1 class="status-title" id="statusTitle">Order Sent to Kitchen!</h1>
      <p class="status-subtitle" id="statusMessage">Your order ticket has arrived in the kitchen.</p>

      <!-- Stepper Indicator -->
      <div class="stepper-container">
        <div class="stepper-line"></div>
        <div class="stepper-progress" id="stepperProgress" style="width: 10%;"></div>

        <!-- Step 1 -->
        <div class="step-item active" id="step-pending">
          <div class="step-circle">1</div>
          <div class="step-label">Pending</div>
        </div>

        <!-- Step 2 -->
        <div class="step-item" id="step-preparing">
          <div class="step-circle">2</div>
          <div class="step-label">Preparing</div>
        </div>

        <!-- Step 3 -->
        <div class="step-item" id="step-served">
          <div class="step-circle">3</div>
          <div class="step-label">Served</div>
        </div>

        <!-- Step 4 -->
        <div class="step-item" id="step-paid">
          <div class="step-circle">4</div>
          <div class="step-label">Paid</div>
        </div>
      </div>

      <!-- Order Receipt Info -->
      <div class="receipt-box">
        <div class="receipt-row">
          <span style="color: var(--color-text-secondary);">Order Reference</span>
          <span style="font-family: monospace; font-weight: 700;" id="receiptOrderId">#...</span>
        </div>
        <div class="receipt-row">
          <span style="color: var(--color-text-secondary);">Table Allocation</span>
          <span style="font-weight: 600;" id="receiptTableNum">Table #...</span>
        </div>
        <div class="receipt-row">
          <span style="color: var(--color-text-secondary);">Order Placed At</span>
          <span id="receiptTime">Just now</span>
        </div>
        <div class="receipt-row" style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--color-card-border);">
          <span style="font-weight: 700;">Total Amount</span>
          <span style="font-weight: 800; color: var(--color-primary);" id="receiptTotal">₹0</span>
        </div>
      </div>

      <!-- Order More Items Button -->
      <button id="orderMoreBtn" class="order-again-btn">
        + Order More Items for this Table
      </button>
    </div>
  </main>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="order-status.js"></script>
</body>
</html>
